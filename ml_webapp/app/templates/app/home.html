<!DOCTYPE html>
<html>
<head>
    <title>Student Score Predictor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 500px;
            margin: auto;
        }
        h2 {
            text-align: center;
        }
        form {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f9f9f9;
        }
        button {
            padding: 8px 15px;
            font-size: 16px;
            background: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            padding: 10px;
            background: #e8f5e9;
            border: 1px solid #4caf50;
            border-radius: 5px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Predict Student Score</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Predict</button>
    </form>

    {% if prediction is not None %}
        <div class="result">
            <h3>Predicted Math Score: {{ prediction }}</h3>
        </div>
    {% endif %}
</div>
</body>
</html>
